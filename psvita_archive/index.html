<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex">
    <link rel="icon" href="../gm.png">
    <title>gadmaj.org/psvita_archive</title>
    <link rel="stylesheet" href="latex.css" />
    <script src="photos.js"></script>
</head>

<body class="app-body">
    <div class="app-container">
        <nav class="nav-bar">
            <a href="#" class="nav-title" id="nav-home">search</a>
            <span class="nav-search">
                <input type="text" id="date-search" list="date-list"
                    placeholder="YYYY-MM-DD" inputmode="numeric"
                    autocomplete="off" spellcheck="false">
                <datalist id="date-list"></datalist>
                <button type="button" id="date-clear" title="clear">&times;</button>
            </span>
            <span class="nav-count" id="nav-count"></span>
        </nav>

        <section class="hero">
            <center>
                <div class="title page-header"><span class="header-small">gadmaj.org</span>/psvita_archive</div>
            </center>
            <p class="hero-text">web application i built in 2023 for senior year of highschool</p>
            <img class="hero-cycle" id="hero-cycle" alt="" decoding="async">
        </section>
        <div class="image-container" id="image-container"></div>
        <div id="scroll-sentinel"></div>
        <div class="end-note" id="end-note" hidden>end of archive</div>
    </div>

    <script>
        const BATCH = 24;
        const container = document.getElementById("image-container");
        const sentinel = document.getElementById("scroll-sentinel");
        const endNote = document.getElementById("end-note");
        const searchBox = document.getElementById("date-search");
        const clearBtn = document.getElementById("date-clear");
        const navCount = document.getElementById("nav-count");

        const all = PHOTOS.slice().reverse(); // newest first, like the original
        let filtered = all;
        let rendered = 0;

        // datalist of the dates that actually have photos
        const dates = [...new Set(PHOTOS.map(f => f.slice(0, 10)))].sort().reverse();
        const dateList = document.getElementById("date-list");
        for (const d of dates) {
            const opt = document.createElement("option");
            opt.value = d;
            dateList.appendChild(opt);
        }

        function makeCell(file) {
            const cell = document.createElement("div");
            cell.className = "image-cell";

            const img = document.createElement("img");
            img.className = "image";
            img.src = `images/${file}`;
            img.alt = file;
            img.loading = "lazy";
            img.decoding = "async";
            cell.appendChild(img);

            const name = document.createElement("div");
            name.className = "image-name";
            name.textContent = file;
            cell.appendChild(name);
            return cell;
        }

        function renderMore() {
            const next = filtered.slice(rendered, rendered + BATCH);
            for (const file of next) container.appendChild(makeCell(file));
            rendered += next.length;
            endNote.hidden = rendered < filtered.length;
            navCount.textContent = filtered.length === all.length
                ? `${all.length}` : `${filtered.length}/${all.length}`;
        }

        function resetAndRender() {
            container.textContent = "";
            rendered = 0;
            renderMore();
        }

        // grid stays empty until the user scrolls past the hero
        let started = false;
        function start() {
            if (started) return;
            started = true;
            renderMore();
            io.observe(sentinel);
        }
        window.addEventListener("scroll", () => {
            if (window.scrollY > 40) start();
        }, { passive: true });

        const io = new IntersectionObserver((entries) => {
            if (entries.some(e => e.isIntersecting) && rendered < filtered.length) {
                renderMore();
            }
        }, { rootMargin: "150% 0px" });

        // hero: cycle random photos
        const heroImg = document.getElementById("hero-cycle");
        function cycleHero() {
            heroImg.src = `images/${PHOTOS[Math.floor(Math.random() * PHOTOS.length)]}`;
        }
        cycleHero();
        setInterval(cycleHero, 2500);

        function applyFilter() {
            const q = searchBox.value.trim();
            filtered = q ? all.filter(f => f.startsWith(q)) : all;
            resetAndRender();
            if (!started) {
                started = true;
                io.observe(sentinel);
            }
        }

        searchBox.addEventListener("input", applyFilter);
        clearBtn.addEventListener("click", () => {
            searchBox.value = "";
            applyFilter();
        });
        document.getElementById("nav-home").addEventListener("click", (e) => {
            e.preventDefault();
            searchBox.value = "";
            applyFilter();
            window.scrollTo({ top: 0 });
        });

        resetAndRender();
    </script>
</body>

</html>
